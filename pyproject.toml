[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "exposure-lens"
version = "0.1.0"
description = "Allowlist-based public URL candidate collector for verified company assets"
requires-python = ">=3.11"
readme = "README.md"
license = { text = "MIT" }

[project.scripts]
exposure-lens = "exposure_lens.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
